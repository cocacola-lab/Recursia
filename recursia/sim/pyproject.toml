[project]
name = "recursia-sim"
version = "0.1.0"
description = "Recursia simulation workspace: recursive self-improvement of a shared executable stack on LIBERO-90, zero-shot evaluation on LIBERO-Long-Pro."
readme = "README.md"
requires-python = ">=3.10, <3.13"
license = { text = "Apache-2.0" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Operating System :: POSIX :: Linux",
]

# Runtime of the LIBERO code-as-policy environment (cap/), the perception servers (cap/serving/) and the RSI harnesses (rsi/).
dependencies = [
  "gymnasium>=0.29",
  "numpy>=1.26",
  "torch>=2.8",
  "torchvision>=0.23",
  "tyro>=0.8.5",
  "pydantic>=2.7",
  "rich>=13.7",
  "scipy>=1.12",
  "matplotlib>=3.10",
  "imageio[ffmpeg]>=0.6.0",
  "requests",
  "tqdm",
  "h5py",
  "einops",
  "decord",
  "pycocotools",
  "pyyaml",
  "omegaconf",
  "open3d",
  "pyroki @ git+https://github.com/chungmin99/pyroki.git",
  "robot_descriptions>=1.16.0",
  "yourdfpy>=0.0.56",
  "viser>=0.2.0",
  "trimesh>=4.4.0",
  "sam3",
  "msgpack_numpy",
  "ray==2.48.0",
  "mediapy>=1.2.5",
  "uvicorn",
  "fastapi",
  "transformers",
  "openai",
  "pyrender",
  "opencv-python-headless",
  "pillow>=10",
  "cloudpickle",
  "setuptools>=70,<82",
]

[project.optional-dependencies]
libero = [
  "libero",
  "robosuite",
  "easydict==1.9",
  "robomimic==0.2.0",
  "einops==0.4.1",
  "thop==0.1.1-2209072238",
  "bddl==1.0.1",
  "future==0.18.2",
  "cloudpickle==2.1.0",
  "gym==0.25.2",
  "scikit-learn",
]
contactgraspnet = [
  "contact_graspnet_pytorch",
  "pyrender",
  "opencv-python-headless",
]
dev = [
  "pytest>=8",
  "pytest-timeout>=2.3",
]

[tool.uv.sources]
libero = { path = "cap/third_party/LIBERO-PRO", editable = true }
robosuite = { path = "cap/third_party/libero_dependencies/robosuite", editable = true }
contact_graspnet_pytorch = { path = "cap/third_party/contact_graspnet_pytorch", editable = true }
sam3 = { path = "cap/third_party/sam3", editable = true }
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
override-dependencies = [
  "transformers<5.0",
  # The pinned Robosuite fork uses the pre-3.10 mj_fullM Python API.
  "mujoco==3.3.0",
  "PyOpenGL==3.1.6",
  "PyOpenGL-accelerate==3.1.6",
  "numpy==1.26.4",
  "scipy==1.15.3",
  "opencv-python-headless<4.13",
  "opencv-python ; sys_platform == 'never'",
  "jax<0.4.30",
  "jaxlib<0.4.30",
  # SAM3 imports pkg_resources, which setuptools removed in 82
  "setuptools>=70,<82",
]

[tool.uv.extra-build-dependencies]
egl-probe = ["cmake<3.27"]
pointnet2 = ["torch"]
knn = ["torch"]
contact-graspnet-pytorch = ["numpy"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cap", "cap.*"]
exclude = ["cap.third_party*"]

[tool.pytest.ini_options]
testpaths = ["tests", "rsi/debugging/harness/tests"]
norecursedirs = [".venv", ".venv-*", "cap/third_party", "outputs"]
